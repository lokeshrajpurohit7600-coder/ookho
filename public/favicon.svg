<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- High-tech Background Gradient -->
    <linearGradient id="akBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="akBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Outer Eye Contour Gradient -->
    <linearGradient id="akEyeContour" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="48%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Radiant Iris Gradient -->
    <radialGradient id="akIris" cx="32" cy="32" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- Scanner Core Gradient -->
    <radialGradient id="akCore" cx="32" cy="32" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="65%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="akGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Neon Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#akBg)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" stroke="url(#akBorder)" stroke-width="2" stroke-opacity="0.95" />

  <!-- Corner Forensic Targeting Reticles -->
  <path d="M9 17V11H15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M55 17V11H49" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M9 47V53H15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M55 47V53H49" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- Horizontal Forensic Target Axis -->
  <line x1="6" y1="32" x2="12" y2="32" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="52" y1="32" x2="58" y2="32" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Bold Eye Contour Profile -->
  <path 
    d="M11 32C16.5 20.5 23.5 15.5 32 15.5C40.5 15.5 47.5 20.5 53 32C47.5 43.5 40.5 48.5 32 48.5C23.5 48.5 16.5 43.5 11 32Z" 
    stroke="url(#akEyeContour)" 
    stroke-width="3.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#akGlow)"
  />

  <!-- Iris Circle with Neon Border -->
  <circle cx="32" cy="32" r="10.5" fill="url(#akIris)" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.9" />

  <!-- Segmented Reticle Ring -->
  <circle cx="32" cy="32" r="7" stroke="#a5f3fc" stroke-width="1.2" stroke-dasharray="3 2" stroke-opacity="0.8" />

  <!-- Sensor Core -->
  <circle cx="32" cy="32" r="4.2" fill="url(#akCore)" stroke="#67e8f9" stroke-width="1" />

  <!-- Pupil Center -->
  <circle cx="32" cy="32" r="2.2" fill="#020617" />

  <!-- Specular Glints -->
  <circle cx="35" cy="28.5" r="1.8" fill="#ffffff" />
  <circle cx="29.5" cy="35" r="1" fill="#a5f3fc" fill-opacity="0.9" />

  <!-- Vertical Forensic Reticle Marks -->
  <line x1="32" y1="15.5" x2="32" y2="19.5" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="32" y1="44.5" x2="32" y2="48.5" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round" />
</svg>