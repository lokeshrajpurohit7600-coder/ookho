<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141927" />
      <stop offset="100%" stop-color="#0a0d16" />
    </linearGradient>
    
    <!-- Artistic Eye Contour Gradient -->
    <linearGradient id="eyeStroke" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="30%" stop-color="#ec4899" />
      <stop offset="68%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Multi-tone Iris Gradient -->
    <linearGradient id="irisGrad" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#f43f5e" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Pupil deep rich tone -->
    <radialGradient id="pupilGrad" cx="30" cy="30" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#080b12" />
    </radialGradient>
  </defs>

  <!-- Squircle rounded container -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Soft watercolor-like color halos behind the eye -->
  <circle cx="30" cy="30" r="18" fill="#8b5cf6" fill-opacity="0.18" />
  <circle cx="36" cy="28" r="14" fill="#f43f5e" fill-opacity="0.16" />
  <circle cx="28" cy="35" r="14" fill="#06b6d4" fill-opacity="0.14" />

  <!-- Outer artistic eye shape with fluid almond curves -->
  <path 
    d="M10 32C15.5 20.5 23 15 32 15C41 15 48.5 20.5 54 32C48.5 43.5 41 49 32 49C23 49 15.5 43.5 10 32Z" 
    stroke="url(#eyeStroke)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Iris circle with vibrant artistic gradient -->
  <circle cx="32" cy="32" r="11" fill="url(#irisGrad)" />

  <!-- Delicate inner iris pattern ring -->
  <circle cx="32" cy="32" r="9" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 1.5" />

  <!-- Pupil -->
  <circle cx="32" cy="32" r="5.5" fill="url(#pupilGrad)" />

  <!-- Lively highlight reflections -->
  <circle cx="35" cy="29" r="2.2" fill="#ffffff" />
  <circle cx="29.5" cy="34.5" r="1.1" fill="#ffffff" fill-opacity="0.85" />
</svg>
